<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goal 3 Inspector</title>
  <link rel="stylesheet" href="inspector.css">
</head>
<body>
  <header class="bar">
    <h1>Goal 3 Inspector</h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="timeline">Timeline</button>
      <button type="button" role="tab" aria-selected="false" data-tab="gallery">Poses &amp; actions</button>
      <button type="button" role="tab" aria-selected="false" data-tab="sounds">Sounds</button>
    </nav>
  </header>

  <main>
    <section id="timeline" class="tab" aria-label="Timeline">
      <div class="toolbar">
        <label>Plan <select id="plan"></select></label>
        <button type="button" id="record" title="Play with the keyboard (arrows, X = A, Z = B, Space = A+B); Esc or the button stops">● Record</button>
        <details class="plan-text">
          <summary>Edit plan</summary>
          <textarea id="plan-text" spellcheck="false" rows="6"></textarea>
          <button type="button" id="plan-run">Run this plan</button>
          <p class="hint">[from, to, buttons] in frames; buttons from L R U D A B.</p>
        </details>
      </div>

      <div class="stage">
        <div class="view">
          <div class="screen">
            <canvas id="scene" width="256" height="173"></canvas>
            <canvas id="overlay" width="768" height="519"></canvas>
            <p id="recording" class="recording" hidden>● REC</p>
          </div>
          <div class="transport">
            <button type="button" data-step="start" title="First frame (Home)">⏮</button>
            <button type="button" data-step="-3" title="Tick back (Shift+←)">◀◀</button>
            <button type="button" data-step="-1" title="Frame back (←)">◀</button>
            <button type="button" id="play" title="Play / pause (Space)">▶</button>
            <button type="button" data-step="1" title="Frame on (→)">▶</button>
            <button type="button" data-step="3" title="Tick on (Shift+→)">▶▶</button>
            <button type="button" data-step="end" title="Last frame (End)">⏭</button>
            <label>Speed <select id="speed">
              <option value="1">1×</option>
              <option value="0.5">½×</option>
              <option value="0.25" selected>¼×</option>
              <option value="0.1">⅒×</option>
            </select></label>
            <label><input type="checkbox" id="sound"> Sound</label>
            <label><input type="checkbox" id="marks" checked> Marks</label>
            <span id="position" class="position"></span>
          </div>
          <input type="range" id="frame" min="0" max="0" value="0" aria-label="Frame">
          <canvas id="strip" height="54" aria-label="Ticks: mode, action, sounds"></canvas>
          <p class="legend" id="legend"></p>
        </div>
        <aside id="state" class="state" aria-label="State"></aside>
      </div>
    </section>

    <section id="gallery" class="tab" aria-label="Poses and actions" hidden>
      <h2>Actions</h2>
      <p class="hint">Click an action to play it. One cell per tick; the events it sends to the ball under it, its hit window shaded.</p>
      <div class="preview"><canvas id="action-preview" width="64" height="64"></canvas><span id="action-name"></span></div>
      <div id="actions"></div>
      <h2>Animations</h2>
      <div id="animations"></div>
      <h2>Poses</h2>
      <div id="poses" class="poses"></div>
    </section>

    <section id="sounds" class="tab" aria-label="Sounds" hidden>
      <h2>Sound effects</h2>
      <div id="sfx" class="sfx"></div>
      <h2>Music</h2>
      <p><button type="button" id="music">▶ Play the song</button></p>
    </section>
  </main>

  <script type="module" src="inspector.js"></script>
</body>
</html>
