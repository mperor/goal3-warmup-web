<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goal 3 Warm-up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scene">
    <header class="title">
      <h1 class="logo" lang="ja">
        <span class="logo__line logo__line--top">くにおくんの</span>
        <span class="logo__line logo__line--main">
          <span class="logo__box">熱</span><span class="logo__box">血</span><span class="logo__kana">サッカーリーグ</span>
        </span>
      </h1>
      <p class="subtitle" data-pixel-text="sans6" data-word-gaps="5 5 4 4 4">KUNIO KUN NO NEKKETSU SOCCER LEAGUE</p>
    </header>

    <main class="pitch">
      <canvas id="game" class="pitch__canvas" width="256" height="96"></canvas>
      <div class="pitch__ground" aria-hidden="true"></div>
    </main>

    <footer class="credits">
      <p data-pixel-text="serif8">&copy; 1993 TECHNOS JAPAN CORP.</p>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>

</html>
